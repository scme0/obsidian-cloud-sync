<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Cloud Drive Sync</title>
	<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
	<header class="app-header">
		<div class="brand">
			<h1>Cloud Drive Sync</h1>
			<span id="version" class="version"></span>
		</div>
		<button id="pauseToggle" class="pause-toggle" type="button">Pause</button>
	</header>

	<main>
		<div id="updateBanner" class="update-banner" hidden>
			<span id="updateText"></span>
			<button id="updateNow" type="button">Update now</button>
		</div>

		<section class="card">
			<h2>Connection</h2>
			<label>Endpoint <input id="endpoint" placeholder="https://s3.example.com/alice" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" /></label>
			<div class="field-grid">
				<label>Access key <input id="accessKey" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" /></label>
				<label>Secret key <input id="secretKey" type="password" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" /></label>
				<label>Region <input id="region" placeholder="us-east-1" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" /></label>
				<label>Sync every (min) <input id="syncIntervalMinutes" type="number" min="0" /></label>
			</div>
		</section>

		<section class="card">
			<div class="card-head">
				<h2>Synced folders</h2>
				<button id="loadBuckets" class="ghost" type="button">Load buckets</button>
			</div>
			<p class="hint">Each row maps a folder on this Mac to a bucket (top-level folder) in your Drive.</p>
			<datalist id="bucketList"></datalist>
			<div id="pairs" class="pair-list"></div>
			<button id="addPair" class="ghost add-row" type="button">+ Add folder</button>
			<div class="new-bucket-row">
				<input id="newBucket" placeholder="new-bucket-name (lowercase)" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" />
				<button id="createBucket" class="ghost" type="button">Create bucket</button>
			</div>
		</section>

		<div class="actions">
			<button id="save" class="primary">Save</button>
			<button id="syncNow">Sync Now</button>
			<span id="status" class="status">Idle</span>
		</div>
	</main>

	<template id="pairTemplate">
		<div class="pair">
			<div class="pair-main">
				<input class="pair-folder" readonly placeholder="No folder selected on this Mac" />
				<span class="pair-arrow">→</span>
				<input class="pair-bucket" list="bucketList" placeholder="bucket" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" />
			</div>
			<div class="pair-controls">
				<button class="pair-choose ghost" type="button">Choose folder…</button>
				<select class="pair-strategy" title="Conflict strategy">
					<option value="latest-wins">Latest wins</option>
					<option value="use-local">Always local</option>
					<option value="use-remote">Always remote</option>
				</select>
				<button class="pair-remove ghost danger" type="button" title="Remove">Remove</button>
			</div>
		</div>
	</template>

	<script type="module" src="/src/main.ts"></script>
</body>
</html>
