<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Cloud Drive Sync</title>
	<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
	<main>
		<h1>Cloud Drive Sync</h1>

		<section>
			<h2>S3 / rclone</h2>
			<label>Endpoint <input id="endpoint" placeholder="https://notes.example.com" /></label>
			<label>Bucket <input id="bucket" placeholder="Audio" /></label>
			<label>Access key <input id="accessKey" /></label>
			<label>Secret key <input id="secretKey" type="password" /></label>
			<label>Region <input id="region" placeholder="us-east-1" /></label>
		</section>

		<section>
			<h2>Local folder</h2>
			<div class="row">
				<input id="localFolder" readonly placeholder="No folder selected" />
				<button id="chooseFolder">Choose Folder</button>
			</div>
		</section>

		<section>
			<h2>Sync interval (minutes)</h2>
			<input id="syncIntervalMinutes" type="number" min="0" />
		</section>

		<div class="row">
			<button id="save">Save</button>
			<button id="syncNow">Sync Now</button>
		</div>

		<p id="status">Idle</p>
	</main>
	<script type="module" src="/src/main.ts"></script>
</body>
</html>
