<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Cloud Drive Sync</title>
	<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
	<main>
		<h1>Cloud Drive Sync</h1>

		<section>
			<h2>S3 / rclone</h2>
			<label>Endpoint <input id="endpoint" placeholder="https://s3.example.com/alice" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" /></label>
			<label>Access key <input id="accessKey" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" /></label>
			<label>Secret key <input id="secretKey" type="password" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" /></label>
			<label>Region <input id="region" placeholder="us-east-1" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" /></label>
		</section>

		<section>
			<h2>Synced folders</h2>
			<p class="hint">Each pair maps a folder on this Mac to a top-level folder (bucket) in your Drive.</p>
			<div class="row">
				<button id="loadBuckets" class="secondary" type="button">Load buckets</button>
				<input id="newBucket" placeholder="new-bucket (lowercase)" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" />
				<button id="createBucket" class="secondary" type="button">Create</button>
			</div>
			<datalist id="bucketList"></datalist>
			<div id="pairs"></div>
			<button id="addPair" class="secondary" type="button">+ Add folder</button>
		</section>

		<section>
			<h2>Conflict strategy</h2>
			<select id="conflictStrategy">
				<option value="latest-wins">Latest wins — newer timestamp takes priority</option>
				<option value="use-local">Always use local</option>
				<option value="use-remote">Always use remote</option>
			</select>
		</section>

		<section>
			<h2>Sync interval (minutes)</h2>
			<input id="syncIntervalMinutes" type="number" min="0" />
		</section>

		<div class="row">
			<button id="save">Save</button>
			<button id="syncNow">Sync Now</button>
		</div>

		<p id="status">Idle</p>
		<p id="version" class="version"></p>
	</main>

	<template id="pairTemplate">
		<div class="pair">
			<input class="pair-bucket" list="bucketList" placeholder="Bucket (e.g. Audio)" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" />
			<div class="row">
				<input class="pair-folder" readonly placeholder="No folder selected" />
				<button class="pair-choose" type="button">Choose</button>
				<button class="pair-remove secondary" type="button" title="Remove">✕</button>
			</div>
		</div>
	</template>

	<script type="module" src="/src/main.ts"></script>
</body>
</html>
